<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoDetailing46 | Tokyo Garage Experience</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
    position:relative;
}

/* =========================
BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
}

.background::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.88)
    ),
    url("https://images.unsplash.com/photo-1544636331-e26879cd4d9b?q=80&w=2200&auto=format&fit=crop");

    background-size:cover;
    background-position:center;

    animation:bgZoom 20s ease-in-out infinite alternate;
    transform:scale(1.08);
}

@keyframes bgZoom{
    from{
        transform:scale(1.08);
    }

    to{
        transform:scale(1.15);
    }
}

/* =========================
NEON LIGHTS
========================= */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.35;
}

.red{
    width:450px;
    height:450px;
    background:#ff0000;
    top:-100px;
    right:-100px;

    animation:redMove 10s infinite alternate ease-in-out;
}

.blue{
    width:350px;
    height:350px;
    background:#0066ff;
    bottom:-100px;
    left:-100px;

    animation:blueMove 12s infinite alternate ease-in-out;
}

@keyframes redMove{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-120px,80px);
    }
}

@keyframes blueMove{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(120px,-60px);
    }
}

/* =========================
RAIN EFFECT
========================= */

.rain{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.rain span{
    position:absolute;
    width:1px;
    height:100px;

    background:linear-gradient(
        transparent,
        rgba(255,255,255,0.35)
    );

    animation:rain linear infinite;
}

@keyframes rain{

    from{
        transform:translateY(-120px);
    }

    to{
        transform:translateY(120vh);
    }

}

/* =========================
NAVBAR
========================= */

nav{
    position:fixed;
    top:0;
    left:0;

    width:100%;

    padding:20px 7%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(255,255,255,0.08);

    z-index:999;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    font-family:'Orbitron',sans-serif;
    font-size:26px;
    font-weight:900;
    letter-spacing:2px;
}

.logo img{
    width:60px;
    height:60px;
    object-fit:contain;

    filter:
    drop-shadow(0 0 10px rgba(255,0,0,0.4))
    drop-shadow(0 0 30px rgba(255,0,0,0.25));
}

.logo span{
    color:#ffffff;
}

/* =========================
NAV LINKS
========================= */

.nav-links{
    display:flex;
    gap:28px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-weight:500;
    position:relative;
    transition:0.3s;
}

.nav-links a::after{
    content:"";
    position:absolute;
    bottom:-5px;
    left:0;

    width:0%;
    height:2px;

    background:#ff1e1e;

    transition:0.3s;
}

.nav-links a:hover::after{
    width:100%;
}

.nav-links a:hover{
    color:#ff1e1e;
}

/* =========================
HERO
========================= */

.hero{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:140px 20px 100px;

    text-align:center;
}

.hero-box{

    max-width:1000px;

    padding:70px 55px;

    border-radius:40px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    box-shadow:
    0 0 50px rgba(255,0,0,0.12),
    inset 0 0 30px rgba(255,255,255,0.02);

    animation:fadeUp 1.2s ease;
}

.japan-text{
    color:#ff1e1e;
    letter-spacing:8px;
    font-size:14px;
    margin-bottom:18px;
}

.hero-logo{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:25px;
}

.hero-logo img{
    width:480px;
    max-width:100%;
    object-fit:contain;

    filter:
    drop-shadow(0 0 25px rgba(255,0,0,0.35))
    drop-shadow(0 0 70px rgba(255,0,0,0.25));

    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }

}

.subtitle{
    font-size:22px;
    color:#dddddd;
    margin-bottom:20px;
}

.tagline{
    color:#b0b0b0;
    line-height:1.8;
    margin-bottom:40px;
}

/* =========================
BUTTON
========================= */

.btn{
    display:inline-block;

    padding:18px 42px;

    border-radius:60px;

    text-decoration:none;
    color:white;

    font-weight:600;

    background:linear-gradient(
        90deg,
        #ff0000,
        #770000
    );

    transition:0.35s;

    border:none;
    cursor:pointer;

    box-shadow:
    0 0 20px rgba(255,0,0,0.35),
    0 0 50px rgba(255,0,0,0.15);
}

.btn:hover{

    transform:translateY(-5px);

    box-shadow:
    0 0 30px #ff0000,
    0 0 70px rgba(255,0,0,0.5);

}

/* =========================
SECTION
========================= */

.section{
    padding:110px 8%;
}

.section-title{
    text-align:center;
    margin-bottom:70px;
}

.section-title h2{
    font-family:'Orbitron',sans-serif;
    font-size:46px;
    margin-bottom:15px;
}

.neon-line{
    width:140px;
    height:4px;

    margin:auto;

    border-radius:30px;

    background:#ff1e1e;

    box-shadow:
    0 0 15px #ff1e1e,
    0 0 35px #ff1e1e;
}

.section-title p{
    margin-top:20px;
    color:#a5a5a5;
}

/* =========================
PRESTATIONS
========================= */

.grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:35px;
}

.card{

    overflow:hidden;

    border-radius:30px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(14px);

    transition:0.4s;
}

.card:hover{

    transform:
    translateY(-10px)
    scale(1.02);

    box-shadow:
    0 0 35px rgba(255,0,0,0.2);

}

.card img{
    width:100%;
    height:240px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:28px;
}

.card h3{
    font-size:24px;
    margin-bottom:15px;
}

.card p{
    color:#bcbcbc;
    line-height:1.8;
    margin-bottom:20px;
}

.price{
    color:#ff1e1e;
    font-size:22px;
    font-weight:700;
}

/* =========================
TARIFS
========================= */

.tarifs{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));

    gap:30px;
}

.tarif-box{

    padding:45px;

    text-align:center;

    border-radius:30px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(14px);

    transition:0.35s;
}

.tarif-box:hover{

    transform:scale(1.04);

    box-shadow:
    0 0 30px rgba(255,0,0,0.2);

}

.tarif-box h3{
    font-size:28px;
    margin-bottom:20px;
}

.tarif{
    font-size:42px;
    color:#ff1e1e;
    font-weight:700;
    margin-bottom:20px;
}

/* =========================
GALERIE
========================= */

.gallery{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:25px;
}

.gallery img{

    width:100%;
    height:280px;

    object-fit:cover;

    border-radius:28px;

    transition:0.4s;
}

.gallery img:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 30px rgba(255,0,0,0.25);

}

/* =========================
CONTACT
========================= */

.contact-box{

    max-width:900px;

    margin:auto;

    padding:60px;

    border-radius:35px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(14px);
}

form{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-top:35px;
}

input,
textarea{

    padding:18px;

    border:none;

    border-radius:16px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:16px;

    outline:none;
}

textarea{
    resize:none;
    height:160px;
}

/* =========================
SOCIALS
========================= */

.socials{

    display:flex;
    justify-content:center;
    gap:20px;

    margin-top:35px;
}

.socials a{

    width:60px;
    height:60px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;

    font-size:26px;

    color:white;

    background:rgba(255,255,255,0.08);

    transition:0.3s;
}

.socials a:hover{

    background:#ff1e1e;

    box-shadow:
    0 0 20px #ff1e1e,
    0 0 40px rgba(255,0,0,0.4);

}

/* =========================
WHATSAPP
========================= */

.whatsapp{

    position:fixed;

    bottom:25px;
    right:25px;

    width:72px;
    height:72px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#25D366;

    color:white;

    text-decoration:none;

    font-size:34px;

    z-index:999;

    box-shadow:
    0 0 25px rgba(37,211,102,0.6);

}

/* =========================
FOOTER
========================= */

footer{
    padding:35px;
    text-align:center;
    color:#999999;
}

.footer-notes {
    font-size: 13px;
    color: #888;
    margin-top: 15px;
    line-height: 1.6;
}

/* =========================
ANIMATION
========================= */

.fade{
    opacity:0;
    transform:translateY(40px);
    transition:1s;
}

.fade.show{
    opacity:1;
    transform:translateY(0);
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

    .hero-logo img{
        width:350px;
    }

    .hero-box{
        padding:50px 35px;
    }

}

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:15px;
        padding:18px 5%;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
        gap:18px;
    }

    .hero-logo img{
        width:270px;
    }

    .section-title h2{
        font-size:34px;
    }

    .contact-box{
        padding:35px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

}

@media(max-width:480px){

    .hero{
        padding-top:180px;
    }

    .subtitle{
        font-size:18px;
    }

    .tagline{
        font-size:15px;
    }

    .hero-box{
        padding:35px 25px;
    }

    .logo{
        font-size:20px;
    }

    .logo img{
        width:48px;
        height:48px;
    }

}

/* =========================
CALENDRIER
========================= */

.calendar-title {
    margin-top: 50px;
    text-align: center;
    color: #ff1e1e;
    font-weight: 600;
    font-size: 22px;

    text-shadow:
    0 0 10px #ff0000,
    0 0 30px #ff0000;
}

iframe {
    border-radius: 25px;
    box-shadow: 0 0 30px rgba(255,0,0,0.2);
}

</style>

</head>

<body>

<!-- BACKGROUND -->

<div class="background">

    <div class="glow red"></div>

    <div class="glow blue"></div>

    <div class="rain" id="rain"></div>

</div>

<!-- NAVBAR -->

<nav>

    <div class="logo">

        <!-- REMPLACE LE LIEN PAR TON LOGO -->
        <img src="https://i.postimg.cc/7Yk7K1qJ/autodetailing46-logo-japonais.png" alt="Logo">

        <span>AutoDetailing46</span>

    </div>

    <div class="nav-links">
        <a href="#services">Prestations</a>
        <a href="#tarifs">Tarifs</a>
        <a href="#galerie">Galerie</a>
        <a href="#contact">Contact</a>
    </div>

</nav>

<!-- HERO -->

<section class="hero">

    <div class="hero-box">

        <div class="japan-text">
            TOKYO UNDERGROUND GARAGE
        </div>

        <div class="hero-logo">

            <!-- REMPLACE LE LIEN PAR TON LOGO -->
            <img src="https://i.postimg.cc/7Yk7K1qJ/autodetailing46-logo-japonais.png" alt="Auto Detailing 46">

        </div>

        <div class="subtitle">
            Esthétique automobile premium •
        </div>

        <div class="tagline">
            Detailing haut de gamme • Effet miroir • Nettoyage premium •
        </div>

        <a href="#contact" class="btn">
            RÉSERVER MAINTENANT
        </a>

    </div>

</section>

</body>
</html>
